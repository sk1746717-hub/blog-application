<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogSphere | Register</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- Navigation -->

    <header class="navbar">

        <div class="logo">
            BlogSphere
        </div>

        <nav>

            <a href="../index.html">Home</a>

            <a href="login.html">Login</a>

            <a href="register.html">Register</a>

        </nav>

    </header>


    <!-- Register Section -->

    <main class="auth-section">

        <div class="auth-card">

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Join BlogSphere and start sharing your stories
            </p>


            <form id="registerForm">

                <!-- Full Name -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Terms -->

                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        I agree to the terms

                    </label>

                </div>


                <!-- Register Button -->

                <button
                    type="submit"
                    class="auth-btn"
                >
                    Create Account
                </button>

            </form>


            <!-- Login Link -->

            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 BlogSphere. All rights reserved.
        </p>

    </footer>


    <script src="../js/script.js"></script>

</body>

</html>
