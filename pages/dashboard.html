<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogSphere | Dashboard</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- Navigation -->

    <header class="navbar">

        <div class="logo">
            BlogSphere
        </div>

        <nav id="navLinks">

            <a href="../index.html">Home</a>

            <a href="dashboard.html">Dashboard</a>

            <a href="create-blog.html">Create Blog</a>

            <a href="login.html" id="authNavBtn">Logout</a>

        </nav>

    </header>


    <!-- Dashboard -->

    <main class="dashboard">

        <!-- Dashboard Header -->

        <section class="dashboard-header">

            <div>

                <p class="dashboard-label" id="welcomeUserLabel">
                    Welcome back
                </p>

                <h1>
                    Your Dashboard
                </h1>

                <p class="dashboard-description">
                    Manage your blogs and create new stories.
                </p>

            </div>


            <a
                href="create-blog.html"
                class="btn"
            >
                + Create Blog
            </a>

        </section>


        <!-- Statistics -->

        <section class="stats-container">


            <div class="stat-card">

                <span class="stat-icon">
                    📝
                </span>

                <div>

                    <p>
                        Total Blogs
                    </p>

                    <h2 id="statTotalBlogs">
                        0
                    </h2>

                </div>

            </div>


            <div class="stat-card">

                <span class="stat-icon">
                    👤
                </span>

                <div>

                    <p>
                        Account Role
                    </p>

                    <h2 id="statUserRole">
                        User
                    </h2>

                </div>

            </div>


            <div class="stat-card">

                <span class="stat-icon">
                    ⭐
                </span>

                <div>

                    <p>
                        Status
                    </p>

                    <h2>
                        Active
                    </h2>

                </div>

            </div>


        </section>


        <!-- My Blogs -->

        <section class="my-blogs">

            <div class="section-header">

                <h2>
                    My Blogs
                </h2>

                <a href="create-blog.html">
                    Create New
                </a>

            </div>


            <div class="dashboard-blog-container" id="dashboardBlogContainer">

                <p style="color: #aab6cc;">Loading your blogs...</p>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 BlogSphere. All rights reserved.
        </p>

    </footer>


    <script src="../js/script.js"></script>

</body>

</html>
