<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogSphere | Home</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .filter-section {
            max-width: 1000px;
            margin: 0 auto 40px auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .search-box {
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 30px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: #17223b;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
        }

        .category-filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            background: rgba(30, 41, 69, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #cbd5e1;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.25s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #7c3aed;
            color: #ffffff;
            border-color: #7c3aed;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }
    </style>

</head>

<body>

    <!-- Navigation Bar -->

    <header class="navbar">

        <div class="logo">
            BlogSphere
        </div>

        <nav id="navLinks">

            <a href="index.html">Home</a>

            <a href="pages/login.html">Login</a>

            <a href="pages/register.html">Register</a>

        </nav>

    </header>


    <!-- Hero Section -->

    <section class="hero">

        <div class="hero-content">

            <h1>
                Share Your Stories With The World
            </h1>

            <p>
                Create, discover and share amazing stories
                with our simple blogging platform.
            </p>

            <a href="pages/register.html" id="heroStartWritingBtn" class="btn">
                Start Writing
            </a>

        </div>

    </section>


    <!-- Latest Blogs -->

    <section class="blogs">

        <h2>
            Explore Stories & Articles
        </h2>

        <!-- Search & Filter Controls -->
        <div class="filter-section">
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search blogs by title, content, or tags...">
            </div>

            <div class="category-filters" id="categoryFilters">
                <button class="filter-btn active" data-category="All">All</button>
                <button class="filter-btn" data-category="Technology">Technology</button>
                <button class="filter-btn" data-category="Programming">Programming</button>
                <button class="filter-btn" data-category="Career">Career</button>
                <button class="filter-btn" data-category="Education">Education</button>
                <button class="filter-btn" data-category="Lifestyle">Lifestyle</button>
            </div>

        </div>


        <div class="blog-container" id="homeBlogContainer">
            <p style="text-align: center; grid-column: 1 / -1; color: #aab6cc;">Loading blogs...</p>
        </div>

    </section>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 BlogSphere. All rights reserved.
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
